<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tour 360">
  <meta name="description" content="Visualizador 360 estático para panoramas top-down stereo.">
  <title>Tour 360</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./assets/icons/icon-192.png">
  <style>
    :root {
      color-scheme: dark;
      font-family: Arial, Helvetica, sans-serif;
      background: #111111;
      color: #f7fbfb;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      background: #111111;
    }

    button,
    select {
      font: inherit;
    }

    #app {
      position: fixed;
      inset: 0;
      min-width: 320px;
      min-height: 100svh;
      background: #111111;
    }

    #viewer {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: #0b0f10;
      cursor: grab;
      touch-action: none;
      user-select: none;
    }

    #viewer:active {
      cursor: grabbing;
    }

    #viewer canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .controls {
      position: fixed;
      z-index: 10;
      top: max(12px, env(safe-area-inset-top));
      left: max(12px, env(safe-area-inset-left));
      right: max(12px, env(safe-area-inset-right));
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 8px;
      background: rgba(17, 17, 17, 0.78);
      box-shadow: 0 14px 42px rgba(0, 0, 0, 0.34);
      backdrop-filter: blur(14px);
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    select,
    button {
      min-height: 40px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 6px;
      color: #f7fbfb;
      background: rgba(255, 255, 255, 0.1);
      outline: none;
    }

    select {
      min-width: 160px;
      max-width: 240px;
      padding: 0 34px 0 12px;
    }

    button {
      padding: 0 14px;
      cursor: pointer;
    }

    button:hover,
    select:hover {
      background: rgba(255, 255, 255, 0.16);
    }

    button:focus-visible,
    select:focus-visible {
      border-color: #63d9c2;
      box-shadow: 0 0 0 3px rgba(99, 217, 194, 0.22);
    }

    .status {
      min-width: 150px;
      margin-left: auto;
      color: #cde7e3;
      font-size: 0.9rem;
      line-height: 1.25;
      text-align: right;
    }

    @media (max-width: 720px) {
      .controls {
        align-items: stretch;
        flex-wrap: wrap;
      }

      select {
        flex: 1 1 100%;
        max-width: none;
      }

      button {
        flex: 1 1 auto;
        padding: 0 10px;
      }

      .status {
        flex: 1 1 100%;
        min-width: 0;
        margin-left: 0;
        text-align: left;
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <main id="viewer" aria-label="Visualizador 360"></main>

    <div class="controls" aria-label="Controles do tour">
      <label class="sr-only" for="panoramaSelect">Imagem</label>
      <select id="panoramaSelect" aria-label="Escolher imagem"></select>
      <button id="previousButton" type="button">Voltar</button>
      <button id="nextButton" type="button">Avançar</button>
      <button id="gyroButton" type="button">Ativar giroscópio</button>
      <div id="status" class="status" role="status" aria-live="polite">Inicializando...</div>
    </div>
  </div>

  <script src="./assets/vendor/three.min.js"></script>
  <script type="module" src="./main/core.js"></script>
</body>
</html>
