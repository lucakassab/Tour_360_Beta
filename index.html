<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; media-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self';">
  <meta name="theme-color" content="#111111">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tour 360">
  <meta name="description" content="Visualizador 360 para panoramas mono.">
  <title>Tour 360</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./assets/icons/favicon.ico" sizes="any">
  <link rel="icon" href="./assets/icons/favicon-32x32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="./assets/icons/favicon-16x16.png" type="image/png" sizes="16x16">
  <link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png" sizes="180x180">
  <meta name="msapplication-TileImage" content="./assets/icons/mstile-150x150.png">
  <style>
    :root {
      color-scheme: dark;
      font-family: Arial, Helvetica, sans-serif;
      background: #111111;
      color: #f7fbfb;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      background: #111111;
    }

    button,
    select {
      font: inherit;
    }

    #app {
      position: fixed;
      inset: 0;
      min-width: 320px;
      min-height: 100svh;
      background: #111111;
    }

    #viewer {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: #0b0f10;
      cursor: grab;
      touch-action: none;
      user-select: none;
    }

    #viewer:active {
      cursor: grabbing;
    }

    #viewer canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .controls {
      position: fixed;
      z-index: 10;
      top: max(12px, env(safe-area-inset-top));
      left: max(12px, env(safe-area-inset-left));
      right: max(12px, env(safe-area-inset-right));
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 8px;
      background: rgba(17, 17, 17, 0.78);
      box-shadow: 0 14px 42px rgba(0, 0, 0, 0.34);
      backdrop-filter: blur(14px);
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    select,
    button {
      min-height: 40px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 6px;
      color: #f7fbfb;
      background: rgba(255, 255, 255, 0.1);
      outline: none;
    }

    select {
      min-width: 160px;
      max-width: 240px;
      padding: 0 34px 0 12px;
      color: #f7fbfb;
      background-color: #242424;
    }

    select option {
      color: #111111;
      background-color: #ffffff;
    }

    button {
      padding: 0 14px;
      cursor: pointer;
    }

    button:hover,
    select:hover {
      background: rgba(255, 255, 255, 0.16);
    }

    button:focus-visible,
    select:focus-visible {
      border-color: #63d9c2;
      box-shadow: 0 0 0 3px rgba(99, 217, 194, 0.22);
    }

    button:disabled {
      cursor: wait;
      opacity: 0.78;
    }

    .loading-overlay {
      position: fixed;
      inset: 0;
      z-index: 8;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #f7fbfb;
      background: rgba(7, 10, 11, 0.28);
      backdrop-filter: blur(4px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.24s ease;
    }

    .loading-overlay[data-visible="true"] {
      opacity: 1;
    }

    .loading-indicator {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      min-height: 42px;
      padding: 10px 14px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 8px;
      background: rgba(17, 17, 17, 0.58);
      box-shadow: 0 14px 38px rgba(0, 0, 0, 0.28);
      backdrop-filter: blur(12px);
      font-size: 14px;
      line-height: 1;
      letter-spacing: 0;
      transform: translateY(6px);
      transition: transform 0.24s ease;
    }

    .loading-overlay[data-visible="true"] .loading-indicator {
      transform: translateY(0);
    }

    .loading-spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.24);
      border-top-color: #63d9c2;
      border-radius: 50%;
      animation: loading-spin 0.82s linear infinite;
    }

    @keyframes loading-spin {
      to {
        transform: rotate(360deg);
      }
    }

    .gyro-status {
      position: fixed;
      z-index: 11;
      left: 50%;
      bottom: max(18px, env(safe-area-inset-bottom));
      width: max-content;
      max-width: min(520px, calc(100vw - 24px));
      padding: 10px 14px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 6px;
      color: #f7fbfb;
      background: rgba(17, 17, 17, 0.9);
      box-shadow: 0 12px 34px rgba(0, 0, 0, 0.36);
      font-size: 14px;
      line-height: 1.35;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 10px);
      transition: opacity 0.18s ease, transform 0.18s ease;
    }

    .gyro-status[data-visible="true"] {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    @media (max-width: 720px) {
      .controls {
        align-items: stretch;
        flex-wrap: wrap;
      }

      select {
        flex: 1 1 100%;
        max-width: none;
      }

      button {
        flex: 1 1 auto;
        padding: 0 10px;
      }

    }
  </style>
</head>
<body>
  <div id="app">
    <main id="viewer" aria-label="Visualizador 360"></main>

    <div id="loadingOverlay" class="loading-overlay" data-visible="false" aria-live="polite" aria-hidden="true">
      <div class="loading-indicator">
        <span class="loading-spinner" aria-hidden="true"></span>
        <span>Carregando...</span>
      </div>
    </div>

    <div class="controls" aria-label="Controles do tour">
      <label class="sr-only" for="panoramaSelect">Imagem</label>
      <select id="panoramaSelect" aria-label="Escolher imagem"></select>
      <button id="previousButton" type="button">Voltar</button>
      <button id="nextButton" type="button">Avan&ccedil;ar</button>
      <button id="gyroButton" type="button">Ativar girosc&oacute;pio</button>
    </div>
  </div>

  <script src="./assets/vendor/three.min.js"></script>
  <script src="./main/tour.app.js?v=20260516180339"></script>
</body>
</html>
